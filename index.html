<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Event Has Ended</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
font-family:'Inter',sans-serif;
background:
radial-gradient(circle at top left, rgba(214,139,42,.18), transparent 25%),
radial-gradient(circle at bottom right, rgba(214,139,42,.08), transparent 30%),
linear-gradient(135deg,#74717a 0%,#605d66 45%,#4b4850 100%);
color:#fff;
min-height:100vh;
display:flex;
flex-direction:column;
overflow-x:hidden;
}

.background-glow{
position:fixed;
width:700px;
height:700px;
border-radius:50%;
background:rgba(214,139,42,.12);
filter:blur(140px);
pointer-events:none;
}

.glow-1{top:-250px;left:-200px}
.glow-2{bottom:-300px;right:-200px}

.container{
max-width:1280px;
margin:0 auto;
padding:0 32px;
width:100%;
position:relative;
z-index:2;
}

nav{
display:flex;
justify-content:center;
padding:40px 0;
}

.logo{
height:90px;
}

.main-content{
flex:1;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
padding:40px 20px;
}

.message h1{
font-size:clamp(48px,8vw,100px);
font-weight:900;
letter-spacing:-0.05em;
text-transform:uppercase;
margin-bottom:20px;
}

.message p{
font-size:20px;
color:rgba(255,255,255,.7);
}

footer{
text-align:center;
padding:60px 20px;
border-top:1px solid rgba(255,255,255,.08);
color:rgba(255,255,255,.5);
position:relative;
z-index:2;
}

@media(max-width:900px){
.container{padding:0 20px}
.message h1{font-size:48px}
}
</style>

<script>
setTimeout(function() {
    window.location.href = "https://vatsimmastery.com";
}, 5000);
</script>

</head>

<body>

<div class="background-glow glow-1"></div>
<div class="background-glow glow-2"></div>

<div class="container">

<nav>
<img src="https://i.postimg.cc/Bng1KyNK/TNBSGTV-2-0-Logo-Backgroundless.png" class="logo" alt="Logo">
</nav>

</div>

<div class="main-content">
    <div class="message">
        <h1>The Event Has Ended</h1>
        <p>You will be redirected in 5 seconds...</p>
    </div>
</div>

<footer>
© 2026 VATSIM Mastery. All Rights Reserved.
</footer>

</body>
</html>
